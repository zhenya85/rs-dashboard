<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
<aside id="menu-bar" class="menu">
  <div class="logo">
    <div class="logo-icon">PD</div>
    <span class="logo-text">Personal<span>Dashboard</span></span>
    <button class="menu-close__button" id="menu-close" title="Свернуть">X</button>
  </div>
  <div class="menu__sections">
    <div class="navigation__wrapper">
      <div class="menu__title">Navigation</div>
      <button data-type="projects" class="navigation__btn active"><span>📁</span> Projects</button>
      <button data-type="employees" class="navigation__btn"><span>👥</span> Employees</button>
    </div>
  </div>

  <div class="menu__footer">
    <div class="menu__title">Period</div>
    <div class="period__wrapper">
      <select id="p-month" class="period-month" onchange="setPeriod()"></select>
      <select id="p-year" class="period-year" onchange="setPeriod()"></select>
    </div>
  </div>
</aside>
<button id="open-menu-btn" class="menu-open__button">></button>
<main>
  <header class="top__bar">
    <div class="title">Control panel</div>
    <div id="period-info" class="period__info">
      Апрель 2026
    </div>
  </header>
  <div class="dashboard">
    <section class="info">
      <div class="info-item">
        <div class="info-item__head">
          <span class="head-name">Projects</span>
          <span class="head-icon">📁</span>
        </div>
        <div class="info-item__main">0</div>
        <div class="info-item__footer">
          Budget: <span>$ 0</span>
        </div>
      </div>
      <div class="info-item">
        <div class="info-item__head">
          <span class="head-name">Employees</span>
          <span class="head-icon">👥</span>
        </div>
        <div class="info-item__main">0</div>
        <div class="info-item__footer">
          Assigned: <span>0</span>
        </div>
      </div>
      <div class="info-item">
        <div class="info-item__head">
          <span class="head-name">FOT</span>
          <span class="head-icon">💰</span>
        </div>
        <div class="info-item__main">$ 0</div>
        <div class="info-item__footer">
          Per month
        </div>
      </div>
      <div class="info-item">
        <div class="info-item__head">
          <span class="head-name">Estimated income</span>
          <span class="head-icon">📈</span>
        </div>
        <div class="info-item__main green">$ 0</div>
        <div class="info-item__footer">
          For the period
        </div>
      </div>
    </section>
    <section class="dashboard__wrapper">
      <table class="dashboard__data">
        <tr>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </table>
    </section>
  </div>
</main>
<script src="./scripts/init.js" type="module"></script>
<script src="./scripts/main.js" type="module"></script>
</body>
</html>
